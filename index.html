<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Downloads</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: white;
            padding: 40px 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .pdf-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pdf-button {
            display: block;
            padding: 15px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.2s ease;
        }

        .pdf-button:hover {
            background: #444;
            transform: translateY(-2px);
        }

        .pdf-button span {
            margin-right: 8px;
        }

        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>PDF Downloads</h1>

        <p class="subtitle">
            Download the documents below
        </p>

        <div class="pdf-list">
            <a href="1.pdf" download class="pdf-button">
                <span>📄</span> Download 1.pdf
            </a>

            <a href="2.pdf" download class="pdf-button">
                <span>📄</span> Download 2.pdf
            </a>

            <a href="3.pdf" download class="pdf-button">
                <span>📄</span> Download 3.pdf
            </a>
        </div>

        <footer>
            © 2026
        </footer>
    </div>
</body>
</html>
